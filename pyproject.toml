[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeops-selfx"
version = "0.1.0"
description = "LifeOps AI + Self-X Evolution Engine"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "LifeOps Team"}]
dependencies = [
    "python-fasthtml>=0.14.0",
    "fastapi>=0.115.0",
    "starlette>=0.40,<0.49",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]
